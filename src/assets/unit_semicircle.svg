<text x="266" y="160" font-family="Be Vietnam Pro" font-size="10.5" font-weight="bold" fill="#1D4ED8">α</text>
<text x="198" y="134" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#B91C1C">180°-α</text>
