<circle cx="150.0" cy="69.6" r="4" fill="#B91C1C"/>
<circle cx="230" cy="69.6" r="3.2" fill="#0F766E"/>
<text x="317.0" y="65.6" font-family="Be Vietnam Pro" font-size="10.5" font-weight="bold" fill="#1D4ED8">M(x₀; y₀)</text>
<text x="82.0" y="65.6" font-family="Be Vietnam Pro" font-size="10.5" font-weight="bold" fill="#B91C1C">M'(-x₀; y₀)</text>
<text x="236" y="65.6" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#0F766E">sin α = y₀</text>
<text x="292.0" y="186" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#1D4ED8">cos α</text>
<text x="128.0" y="186" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#B91C1C">-cos α</text>
<text x="356" y="187" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#0F172A">1</text>
<text x="90" y="187" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#0F172A">-1</text>
<text x="218" y="37" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#0F172A">1</text>
<text x="220" y="186" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#0F172A">O</text>
<rect x="410" y="16" width="336" height="178" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
<text x="578" y="37" text-anchor="middle" font-family="Be Vietnam Pro" font-size="11.2" font-weight="bold" fill="#1E3A8A">Định nghĩa &amp; Dấu GTLG trên [0°; 180°]</text>
<text x="422" y="59" font-family="Be Vietnam Pro" font-size="9.7" fill="#0F172A">• Điểm M(x₀; y₀) trên nửa đường tròn đơn vị:</text>
<text x="432" y="78" font-family="Be Vietnam Pro" font-size="9.8" font-weight="bold" fill="#1D4ED8">sin α = y₀ ;  cos α = x₀ ;  tan α = y₀/x₀ ;  cot α = x₀/y₀</text>
<text x="422" y="101" font-family="Be Vietnam Pro" font-size="9.7" fill="#15803D">• Góc nhọn (0° &lt; α &lt; 90°): sin, cos, tan, cot đều &gt; 0.</text>
<text x="422" y="121" font-family="Be Vietnam Pro" font-size="9.6" font-weight="bold" fill="#B91C1C">• Góc tù (90° &lt; α &lt; 180°): sin α &gt; 0; cos, tan, cot &lt; 0!</text>
<text x="422" y="145" font-family="Be Vietnam Pro" font-size="9.7" fill="#0F172A">• Hai góc bù nhau (α và 180° - α) — “Sin bù”:</text>
<text x="432" y="165" font-family="Be Vietnam Pro" font-size="9.8" font-weight="bold" fill="#0F766E">sin(180°-α) = sin α ;  cos(180°-α) = -cos α</text>
<text x="432" y="182" font-family="Be Vietnam Pro" font-size="9.8" font-weight="bold" fill="#0F766E">tan(180°-α) = -tan α ; cot(180°-α) = -cot α</text>
</svg>
