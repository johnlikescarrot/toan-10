<text x="570" y="175" text-anchor="middle" font-family="Be Vietnam Pro" font-size="9.8" font-weight="bold" fill="#0F172A">n(A∪B∪C) = Σn(A) - Σn(A∩B) + n(A∩B∩C)</text>
