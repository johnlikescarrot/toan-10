<line x1="172.7" y1="96.7" x2="172.7" y2="134" stroke="#B45309" stroke-width="1.2"/>
<text x="160" y="30" font-family="Be Vietnam Pro" font-size="12" font-weight="bold" fill="#0F172A">A</text>
<text x="91" y="139" font-family="Be Vietnam Pro" font-size="12" font-weight="bold" fill="#0F172A">B</text>
<text x="273" y="139" font-family="Be Vietnam Pro" font-size="12" font-weight="bold" fill="#0F172A">C</text>
<text x="161" y="148" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#B91C1C">H</text>
<text x="147" y="92.0" font-family="Be Vietnam Pro" font-size="10.5" font-weight="bold" fill="#B91C1C">hₐ</text>
<text x="110" y="98" font-family="Be Vietnam Pro" font-size="11" font-weight="bold" fill="#1E3A8A">c</text>
<text x="228" y="96" font-family="Be Vietnam Pro" font-size="11" font-weight="bold" fill="#1E3A8A">b</text>
<text x="195" y="150" font-family="Be Vietnam Pro" font-size="11" font-weight="bold" fill="#1E3A8A">a</text>
<text x="230.0" y="121.5" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#1D4ED8">R</text>
<text x="176.7" y="118.4" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#B45309">r</text>
<rect x="345" y="14" width="398" height="177" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
<text x="544" y="34" text-anchor="middle" font-family="Be Vietnam Pro" font-size="11.5" font-weight="bold" fill="#1E3A8A">3 Trụ cột Hệ thức lượng trong tam giác ABC</text>
<text x="358" y="56" font-family="Be Vietnam Pro" font-size="10.2" font-weight="bold" fill="#1D4ED8">1. Định lí Côsin:</text>
<text x="458" y="56" font-family="Be Vietnam Pro" font-size="10.2" fill="#0F172A">a² = b² + c² - 2bc·cos A  ⇒  cos A = (b²+c²-a²)/(2bc)</text>
<text x="358" y="80" font-family="Be Vietnam Pro" font-size="10.2" font-weight="bold" fill="#0F766E">2. Định lí Sin:</text>
<text x="458" y="80" font-family="Be Vietnam Pro" font-size="10.2" fill="#0F172A">a / sin A = b / sin B = c / sin C = 2R</text>
<text x="358" y="104" font-family="Be Vietnam Pro" font-size="10.2" font-weight="bold" fill="#B45309">3. Năm công thức diện tích S (với p = (a+b+c)/2):</text>
<text x="368" y="125" font-family="Be Vietnam Pro" font-size="10.1" fill="#0F172A">• S = ½·a·hₐ = ½·b·h_b = ½·c·h_c</text>
<text x="368" y="144" font-family="Be Vietnam Pro" font-size="10.1" fill="#0F172A">• S = ½·b·c·sin A = ½·a·c·sin B = ½·a·b·sin C</text>
<text x="368" y="163" font-family="Be Vietnam Pro" font-size="10.1" fill="#0F172A">• S = abc / (4R)   • S = p·r   • Heron: S = √[p(p-a)(p-b)(p-c)]</text>
<text x="368" y="182" font-family="Be Vietnam Pro" font-size="9.8" font-weight="bold" fill="#B91C1C">⇒ Suy ra nhanh: hₐ = 2S/a ;  R = abc/(4S) ;  r = S/p</text>
</svg>
