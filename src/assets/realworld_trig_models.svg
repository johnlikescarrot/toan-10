<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200">
<rect x="4" y="4" width="368" height="192" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
<rect x="388" y="4" width="368" height="192" rx="8" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1.2"/>
<text x="188" y="23" text-anchor="middle" font-family="Be Vietnam Pro" font-size="11.2" font-weight="bold" fill="#1E3A8A">Mô hình 1: Đo khoảng cách AB qua vật cản (hồ nước)</text>
<ellipse cx="195" cy="96" rx="68" ry="32" fill="#93C5FD" fill-opacity="0.6" stroke="#3B82F6" stroke-width="1.2"/>
<text x="195" y="100" text-anchor="middle" font-family="Be Vietnam Pro" font-size="10" font-style="italic" fill="#1E40AF">Hồ nước</text>
<line x1="95" y1="152" x2="108" y2="68" stroke="#0F172A" stroke-width="1.8"/>
<line x1="95" y1="152" x2="290" y2="112" stroke="#0F172A" stroke-width="1.8"/>
<line x1="108" y1="68" x2="290" y2="112" stroke="#B91C1C" stroke-width="2" stroke-dasharray="6,4"/>
<circle cx="95" cy="152" r="3.5" fill="#0F172A"/>
<circle cx="108" cy="68" r="3.5" fill="#B91C1C"/>
<circle cx="290" cy="112" r="3.5" fill="#B91C1C"/>
<text x="76" y="162" font-family="Be Vietnam Pro" font-size="11" font-weight="bold" fill="#0F172A">C</text>
<text x="90" y="63" font-family="Be Vietnam Pro" font-size="11" font-weight="bold" fill="#B91C1C">A</text>
<text x="297" y="116" font-family="Be Vietnam Pro" font-size="11" font-weight="bold" fill="#B91C1C">B</text>
<text x="78" y="112" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#1E3A8A">b</text>
<text x="196" y="147" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#1E3A8A">a</text>
<text x="115" y="140" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#B45309">∠C</text>
<text x="188" y="183" text-anchor="middle" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#0F172A">Đo CA = b, CB = a, góc C ⇒ AB = √(a² + b² - 2ab·cos C)</text>
<text x="572" y="23" text-anchor="middle" font-family="Be Vietnam Pro" font-size="11.2" font-weight="bold" fill="#0F766E">Mô hình 2: Đo chiều cao tháp CH từ 2 vị trí ngắm A, B</text>
<line x1="415" y1="152" x2="725" y2="152" stroke="#334155" stroke-width="1.6"/>
<rect x="678" y="48" width="14" height="104" fill="#CBD5E1" stroke="#475569" stroke-width="1.3"/>
<line x1="685" y1="36" x2="685" y2="48" stroke="#B91C1C" stroke-width="2"/>
<rect x="676" y="143" width="9" height="9" fill="none" stroke="#B91C1C" stroke-width="1.1"/>
<line x1="445" y1="152" x2="685" y2="48" stroke="#1D4ED8" stroke-width="1.7"/>
<line x1="555" y1="152" x2="685" y2="48" stroke="#0F766E" stroke-width="1.7"/>
<circle cx="445" cy="152" r="3.5" fill="#1D4ED8"/>
<circle cx="555" cy="152" r="3.5" fill="#0F766E"/>
<circle cx="685" cy="48" r="3.5" fill="#B91C1C"/>
<text x="440" y="167" font-family="Be Vietnam Pro" font-size="11" font-weight="bold" fill="#1D4ED8">A</text>
<text x="550" y="167" font-family="Be Vietnam Pro" font-size="11" font-weight="bold" fill="#0F766E">B</text>
<text x="682" y="167" font-family="Be Vietnam Pro" font-size="11" font-weight="bold" fill="#0F172A">H</text>
<text x="694" y="50" font-family="Be Vietnam Pro" font-size="11" font-weight="bold" fill="#B91C1C">C</text>
<text x="478" y="148" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#1D4ED8">α</text>
<text x="582" y="148" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#0F766E">β</text>
<text x="500" y="167" text-anchor="middle" font-family="Be Vietnam Pro" font-size="10" font-weight="bold" fill="#B45309">d = AB</text>
<text x="702" y="106" font-family="Be Vietnam Pro" font-size="10.5" font-weight="bold" fill="#B91C1C">h</text>
<text x="572" y="185" text-anchor="middle" font-family="Be Vietnam Pro" font-size="9.8" font-weight="bold" fill="#0F172A">∠ACB = β - α ⇒ Định lí Sin trong ΔABC tìm BC ⇒ h = BC·sin β</text>
</svg>
