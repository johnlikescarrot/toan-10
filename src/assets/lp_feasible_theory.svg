<text x="159.2" y="46.7" font-family="Be Vietnam Pro" font-size="9.8" font-weight="bold" fill="#0F766E">d₂: 2x + y = 10</text>
<text x="117.4" y="147.8" font-family="Be Vietnam Pro" font-size="10.5" font-weight="bold" fill="#1E3A8A">Miền OABC</text>
<rect x="430" y="20" width="312" height="187" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
<text x="586" y="42" text-anchor="middle" font-family="Be Vietnam Pro" font-size="11.5" font-weight="bold" fill="#1E3A8A">Minh họa tìm GTLN của F(x; y) = 3x + 4y</text>
<text x="444" y="64" font-family="Be Vietnam Pro" font-size="10.2" fill="#334155">Hệ ràng buộc: x ≥ 0; y ≥ 0; x + 2y ≤ 8; 2x + y ≤ 10.</text>
<text x="444" y="84" font-family="Be Vietnam Pro" font-size="10.2" fill="#334155">Miền nghiệm là tứ giác lồi OABC với 4 đỉnh:</text>
<text x="454" y="106" font-family="Be Vietnam Pro" font-size="10.3" fill="#0F172A">• Tại O(0; 0):   F(0; 0) = 3·0 + 4·0 = 0</text>
<text x="454" y="126" font-family="Be Vietnam Pro" font-size="10.3" fill="#0F172A">• Tại A(0; 4):   F(0; 4) = 3·0 + 4·4 = 16</text>
<text x="454" y="146" font-family="Be Vietnam Pro" font-size="10.5" font-weight="bold" fill="#B91C1C">• Tại B(4; 2):   F(4; 2) = 3·4 + 4·2 = 20 (MAX)</text>
<text x="454" y="166" font-family="Be Vietnam Pro" font-size="10.3" fill="#0F172A">• Tại C(5; 0):   F(5; 0) = 3·5 + 4·0 = 15</text>
<text x="444" y="192" font-family="Be Vietnam Pro" font-size="10.2" font-weight="bold" fill="#0F766E">⇒ GTLN của F bằng 20 đạt tại đỉnh B(4; 2).</text>
</svg>
